services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: baxish
      POSTGRES_USER: baxish
      POSTGRES_PASSWORD: baxish
    ports: ["5432:5432"]
    volumes: [baxish_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baxish"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  baxish_data:
