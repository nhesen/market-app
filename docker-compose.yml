services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: martiq
      POSTGRES_USER: martiq
      POSTGRES_PASSWORD: martiq
    ports: ["5432:5432"]
    volumes: [martiq_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U martiq"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  martiq_data:

